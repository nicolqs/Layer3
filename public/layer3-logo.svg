  <rect x="16" y="12" width="8" height="8" fill="white"/>
  <rect x="16" y="4" width="8" height="4" fill="white"/>
  
  <!-- LAYER3 Text -->
  <text x="32" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="white">LAYER3</text>
</svg>

